<!DOCTYPE html>
<html lang="hr">
<head>

<title>Potrošnja</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1d21;
    --muted: #8a8f98;
    --line: #e7e9ee;
    --track: #eceef2;
    /* status: zeleno / žuto / crveno — samo za limite i prag */
    --green: #0ca30c;
    --yellow: #fab219;
    --red: #d03b3b;
    /* kategorijske boje (donut) — boja prati kategoriju, ne rang */
    --c-ducan: #2a78d6;
    --c-marenda: #eb6834;
    --c-izlasci: #1baf7a;
    --c-cigare: #eda100;
    --c-njega: #e87ba4;
    --c-auto: #008300;
    --c-iznimke: #4a3aa7;
    --c-ostalo: #8a8f98;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .big { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--green); font-weight: 600; }
  .err { color: var(--red); font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.opis { white-space: normal; }
  .msg { text-align: center; padding: 32px 16px; }

  /* ---------- HOME ---------- */
  .top { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 12px; }
  .top h1 { margin: 0; }

  .hero { text-align: center; padding: 24px 16px 20px; }
  .ring { position: relative; width: 220px; max-width: 70vw; aspect-ratio: 1; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .ring .fill { transition: stroke-dashoffset .8s ease, stroke .3s; }
  .ring .val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ring .num { font-size: 60px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .ring .num small { font-size: 24px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .ring .num.preko, .ring .num.preko small { color: var(--red); }
  .sub { margin-top: 14px; color: var(--muted); font-size: 13px; }

  .bar-row { padding: 9px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--line); }
  .bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .bar-head .n { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .bar-head:last-child { margin-bottom: 0; }
  .bar-head .n span { color: var(--muted); font-weight: 400; }
  .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; min-width: 0; }
  .s-ok { background: var(--green); }
  .s-warn { background: var(--yellow); }
  .s-over { background: var(--red); }
  .flag { color: var(--red); font-weight: 700; margin-left: 4px; }

  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .donut { position: relative; width: 170px; aspect-ratio: 1; flex: none; }
  .donut svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .donut circle.seg { cursor: pointer; transition: opacity .2s; }
  .donut.has-sel circle.seg:not(.sel) { opacity: .25; }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .donut .center b { font-size: 22px; }
  .legend { flex: 1 1 180px; min-width: 0; }
  .legend .li { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 8px; cursor: pointer; }
  .legend .li.sel { background: var(--track); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .pc { font-variant-numeric: tabular-nums; font-weight: 600; }
  .legend .eu { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; width: 48px; text-align: right; }

  .top3 { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .top3 + .top3 { border-top: 1px solid var(--line); }
  .top3 .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--track); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); flex: none; }
  .top3 .info { flex: 1; min-width: 0; }
  .top3 .info .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top3 .amt { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .foot { text-align: center; margin-top: 6px; }

  /* ---------- GRAFOVI (funkcionalno; polish je Faza 6) ---------- */
  :root { --axis: #c3c7cf; }
  .tmpnav { font-size: 14px; color: var(--muted); margin: 0 2px 8px; }
  .tmpnav a { color: #2a78d6; text-decoration: none; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .ax { font-size: 10px; fill: var(--muted); }
  .chart .ax.cur { fill: var(--text); font-weight: 700; }
  .chart .val { font-size: 10px; fill: var(--text); font-weight: 600; }
  .chart .grp { cursor: pointer; transition: opacity .2s; }
  .chart .grp.dim { opacity: .3; }
  .detail { min-height: 22px; margin-top: 6px; font-size: 14px; }
  .isti { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .key { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .key .kk { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--text); margin-right: 6px; vertical-align: -1px; }
  .key .kk.faint { opacity: .35; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; }
  .seg-toggle { display: inline-flex; background: var(--track); border-radius: 9px; padding: 2px; }
  .seg-toggle button { border: 0; background: transparent; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 7px; color: var(--muted); cursor: pointer; }
  .seg-toggle button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  /* ---------- CUSTOM (funkcionalno; polish je Faza 6) ---------- */
  .raspon-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: inherit; font-size: 16px; font-weight: 600; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; }
  .raspon-btn.open { border-color: #2a78d6; }
  .raspon-btn .muted { font-weight: 400; margin-right: 2px; }
  #r-kal { margin-top: 12px; }
  .kal-head { display: flex; justify-content: space-between; align-items: center; }
  .kal-nav { width: 44px; height: 44px; border: 0; background: transparent; font-size: 26px; color: #2a78d6; cursor: pointer; border-radius: 10px; }
  .kal-hint { text-align: center; font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
  .kal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
  .kal-grid .dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 4px; }
  .kal-grid .d { position: relative; height: 42px; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text); cursor: pointer; padding: 0; }
  .kal-grid .d.today { font-weight: 700; }
  .kal-grid .d.in { background: #dce9fa; }
  .kal-grid .d.end { background: #2a78d6; color: #fff; font-weight: 700; border-radius: 10px; }
  .kal-grid .d i { position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
  .kal-grid .d.end i { background: #fff; }
  .big-num { font-size: 52px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .big-num small { font-size: 22px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .tr-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .tr-row + .tr-row { border-top: 1px solid var(--line); }
  .tr-info { flex: 1; min-width: 0; }
  .tr-row b { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<main id="app">
  <div class="card msg muted">Učitavam…</div>
</main>

<script>
// ============================================================
// KONFIGURACIJA — Ele mijenja ovdje
// ============================================================

// Google Sheet → File → Share → Publish to web → CSV
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjVjLOQgPTtVtjINVAtvRr2F-iacKL2Nc3NlsTY7Z1CO-ao3eL6eFPN0ofGHk9_tIyIsQV2Eaw8HCD/pub?output=csv";

// naziv = SAMO tekst (za matchanje, bez emojija). emoji = zasebno, samo za prikaz.
const KATEGORIJE = [
  { naziv: "Dućan",    emoji: "🛒", limit: 250 },
  { naziv: "Marenda",  emoji: "🍔", limit: 110 },
  { naziv: "Izlasci",  emoji: "🎉", limit: 200 },
  { naziv: "Cigare",   emoji: "🚬", limit: 120 },
  { naziv: "Njega",    emoji: "💈", limit: 80  },
  { naziv: "Auto",     emoji: "🚗", limit: 50  },  // placeholder dok Ele ne vozi — koregirati kod kupnje auta
  { naziv: "Iznimke",  emoji: "🚨", limit: null } // bez limita — nepredvidivo
];

const UKUPNI_PRAG = 1000; // mjesečni raspoloživi novac

// Sigurnosna mreža: kategorija iz Sheeta koje nema gore (npr. typo u Shortcutu).
// Broji se u ukupno, bez limita — nijedan trošak se ne baca van.
const OSTALO = { naziv: "Ostalo", emoji: "❔", limit: null };

const DAN_CIKLUSA = 8; // ciklus 8. → 8. (kraj isključiv)

// ============================================================
// PODACI — fetch + parse
// ============================================================

// CSV parser (RFC 4180): navodnici, "" unutar navodnika, zarez u polju, CRLF/LF.
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// "Dućan 🛒" → "Dućan": skini sve što nije slovo/broj s početka i kraja (spec 3.1).
function ocistiKategoriju(s) {
  return String(s || "").normalize("NFC").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
}

function nadjiKategoriju(sirova) {
  const cista = ocistiKategoriju(sirova).toLocaleLowerCase("hr");
  return KATEGORIJE.find(k => k.naziv.normalize("NFC").toLocaleLowerCase("hr") === cista) || OSTALO;
}

// "2026-09-18 8:49" ili "2026-09-18 08:49" → Date u lokalnom vremenu (Europe/Zagreb na telefonu).
function parseTimestamp(s) {
  const m = String(s || "").trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
  return isNaN(d) ? null : d;
}

// "7.5" → 7.5; "#NUM!", "" → null
function parseIznos(s) {
  const t = String(s || "").trim().replace(/\s/g, "").replace(",", ".");
  return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : null;
}

// Sirovi CSV → { troskovi, preskoceno }. Stupci: timestamp, iznos, kategorija, dan, opis.
function ucitajTroskove(csvText) {
  const redovi = parseCSV(csvText.replace(/^﻿/, "")).slice(1); // prvi red = zaglavlje
  const troskovi = [], preskoceno = [];
  for (const r of redovi) {
    if (r.every(f => f.trim() === "")) continue; // potpuno prazan red — nije trošak
    const datum = parseTimestamp(r[0]);
    const iznos = parseIznos(r[1]);
    if (!datum || iznos === null) { preskoceno.push(r); continue; }
    const kat = nadjiKategoriju(r[2]);
    troskovi.push({
      timestamp: datum,
      iznos,
      kategorija: kat.naziv,
      kategorijaSirova: (r[2] || "").trim(),
      dan: (r[3] || "").trim(),
      opis: (r[4] || "").trim(),
    });
  }
  troskovi.sort((a, b) => a.timestamp - b.timestamp);
  return { troskovi, preskoceno };
}

async function dohvatiCSV() {
  const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.text();
}

// ============================================================
// LOGIKA CIKLUSA (spec 4) — sve uživo iz sirovih podataka
// ============================================================

// Ciklus koji sadrži zadani datum: { start, end } s krajem ISKLJUČIVIM.
function ciklusZa(datum) {
  const y = datum.getFullYear(), m = datum.getMonth();
  const mStart = datum.getDate() >= DAN_CIKLUSA ? m : m - 1; // Date sam preliva mjesec/godinu
  return { start: new Date(y, mStart, DAN_CIKLUSA), end: new Date(y, mStart + 1, DAN_CIKLUSA) };
}

function prethodniCiklus(c) {
  return ciklusZa(new Date(c.start.getFullYear(), c.start.getMonth(), c.start.getDate() - 1));
}

function sljedeciCiklus(c) {
  return ciklusZa(c.end);
}

function uRasponu(troskovi, start, end) {
  return troskovi.filter(t => t.timestamp >= start && t.timestamp < end);
}

// Redni broj kalendarskog dana (neovisno o ljetnom/zimskom vremenu).
function danIndeks(d) {
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

// Proteklo: danas UKLJUČEN (prvi dan ciklusa = 1).
function protekloDana(c, danas) {
  return danIndeks(danas) - danIndeks(c.start) + 1;
}

// Preostalo: od sutra do zadnjeg dana ciklusa (8. sljedećeg NIJE u ciklusu).
function preostaloDana(c, danas) {
  return danIndeks(c.end) - danIndeks(danas) - 1;
}

const MJESECI = ["Siječanj", "Veljača", "Ožujak", "Travanj", "Svibanj", "Lipanj",
                 "Srpanj", "Kolovoz", "Rujan", "Listopad", "Studeni", "Prosinac"];

function oznakaCiklusa(c) {
  return MJESECI[c.start.getMonth()] + " " + c.start.getFullYear();
}

// Svi ciklusi od najstarijeg troška do ciklusa koji sadrži `danas`.
function sviCiklusi(troskovi, danas) {
  const zadnji = ciklusZa(danas);
  let c = troskovi.length ? ciklusZa(troskovi[0].timestamp) : zadnji;
  const out = [];
  while (c.start <= zadnji.start) { out.push(c); c = sljedeciCiklus(c); }
  return out;
}

function zbroj(troskovi) {
  return troskovi.reduce((s, t) => s + t.iznos, 0);
}

function poKategoriji(troskovi) {
  const sve = [...KATEGORIJE, OSTALO];
  return sve.map(k => {
    const t = troskovi.filter(x => x.kategorija === k.naziv);
    return { ...k, iznos: zbroj(t), broj: t.length };
  }).filter(k => k.naziv !== OSTALO.naziv || k.broj > 0); // Ostalo samo ako ga ima
}

const PRAG_ZUTO = 0.8; // od 80 % limita/praga → žuto

// Status prema limitu: "ok" (<80 %), "warn" (80–100 %), "over" (≥100 %), "none" (bez limita).
function statusLimita(iznos, limit) {
  if (limit == null) return "none";
  const p = iznos / limit;
  return p >= 1 ? "over" : p >= PRAG_ZUTO ? "warn" : "ok";
}

// Ukupno prema UKUPNI_PRAG: crveno tek kad PREĐE prag.
function statusUkupno(iznos) {
  const p = iznos / UKUPNI_PRAG;
  return p > 1 ? "over" : p >= PRAG_ZUTO ? "warn" : "ok";
}

// Najveći pojedinačni troškovi; kod istog iznosa noviji ide prvi.
function topTroskovi(troskovi, n) {
  return troskovi.slice().sort((a, b) => b.iznos - a.iznos || b.timestamp - a.timestamp).slice(0, n);
}

// ---------- POVIJEST (spec 6) ----------

// Ciklus je "stvaran" tek od ciklusa prvog troška u Sheetu — raniji se prikazuju kao prazno, ne kao 0 €.
function imaPodatke(troskovi, c) {
  return troskovi.length > 0 && c.start >= ciklusZa(troskovi[0].timestamp).start;
}

// Zadnjih n ciklusa unatrag od danas (klizno, uklj. tekući), najstariji prvi — spec 6.4.
function zadnjihCiklusa(troskovi, danas, n) {
  const tekuci = ciklusZa(danas);
  const out = [];
  for (let c = tekuci, i = 0; i < n; i++, c = prethodniCiklus(c)) {
    out.unshift({
      ciklus: c,
      iznos: zbroj(uRasponu(troskovi, c.start, c.end)),
      uTijeku: c.start.getTime() === tekuci.start.getTime(),
      imaPodatke: imaPodatke(troskovi, c),
    });
  }
  return out;
}

// Zatvoreni (prošli) ciklusi s podacima, najnoviji prvi — spec 6.1.
function zatvoreniCiklusi(troskovi, danas) {
  const tekuci = ciklusZa(danas);
  return sviCiklusi(troskovi, danas)
    .filter(c => c.start < tekuci.start)
    .reverse()
    .map(c => ({ ciklus: c, iznos: zbroj(uRasponu(troskovi, c.start, c.end)) }));
}

// Tekući vs prošli po kategoriji — spec 6.3. prosli = null ako prošli ciklus nema podataka.
function usporedbaCiklusa(troskovi, danas) {
  const c = ciklusZa(danas), p = prethodniCiklus(c);
  const sada = poKategoriji(uRasponu(troskovi, c.start, c.end));
  const imaProsli = imaPodatke(troskovi, p);
  const prije = imaProsli ? poKategoriji(uRasponu(troskovi, p.start, p.end)) : [];
  const nazivi = [...new Set([...sada, ...prije].map(k => k.naziv))];
  return {
    tekuci: c, prosli: imaProsli ? p : null,
    kategorije: nazivi.map(n => {
      const k = [...KATEGORIJE, OSTALO].find(x => x.naziv === n);
      return {
        ...k,
        sada: (sada.find(x => x.naziv === n) || { iznos: 0 }).iznos,
        prije: imaProsli ? (prije.find(x => x.naziv === n) || { iznos: 0 }).iznos : null,
      };
    }),
  };
}

// ---------- CUSTOM RASPON (spec 7) ----------

// Troškovi od datuma "od" (00:00) do datuma "do" UKLJUČIVO (cijeli dan), sortirano po vremenu.
// Namjerno drukčije od ciklusa (kraj isključiv) — ovo je ljudski raspon "od ovog do ovog dana".
function troskoviOdDo(troskovi, od, doDatum) {
  const start = new Date(od.getFullYear(), od.getMonth(), od.getDate());
  const kraj = new Date(doDatum.getFullYear(), doDatum.getMonth(), doDatum.getDate() + 1);
  return uRasponu(troskovi, start, kraj);
}

// Dnevne sume tekućeg ciklusa (spec 5.6): jedan element po danu ciklusa.
// Dani bez troška = 0; budući dani = null (ne crtaju se). Nijedan trošak se ne gubi.
function dnevneSume(troskovi, danas) {
  const c = ciklusZa(danas);
  const brojDana = danIndeks(c.end) - danIndeks(c.start);
  const dani = Array.from({ length: brojDana }, (_, i) => ({
    datum: new Date(c.start.getFullYear(), c.start.getMonth(), c.start.getDate() + i),
    iznos: 0,
  }));
  for (const t of uRasponu(troskovi, c.start, c.end)) dani[danIndeks(t.timestamp) - danIndeks(c.start)].iznos += t.iznos;
  // Zadnji prikazani dan = danas (ili kasniji dan ako u njemu već postoji trošak).
  let zadnji = danIndeks(danas) - danIndeks(c.start);
  dani.forEach((d, i) => { if (d.iznos && i > zadnji) zadnji = i; });
  let kum = 0;
  return dani.map((d, i) => {
    kum += d.iznos;
    const buduci = i > zadnji;
    return { ...d, iznos: buduci ? null : d.iznos, kumulativno: buduci ? null : kum };
  });
}

// "Isti dan prošlog ciklusa" = isti BROJ DANA od početka ciklusa (spec 6.3).
// Dan N tekućeg (danas uklj.) ↔ dani 1..N prošlog; ako je prošli kraći, uzima se cijeli.
function istiDanProslog(troskovi, danas) {
  const c = ciklusZa(danas), p = prethodniCiklus(c);
  if (!imaPodatke(troskovi, p)) return null;
  const dan = protekloDana(c, danas);
  const granica = new Date(Math.min(
    new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate() + dan).getTime(), p.end.getTime()));
  return {
    dan,
    prosli: p,
    prije: zbroj(uRasponu(troskovi, p.start, granica)),
    sada: zbroj(uRasponu(troskovi, c.start, c.end)),
  };
}

// PRIKAZ
// ============================================================

const eur = n => Math.round(n).toLocaleString("hr-HR") + " €";
const tocno = n => n.toLocaleString("hr-HR", { maximumFractionDigits: 2 }) + " €";
const datumKratko = d => d.getDate() + "." + (d.getMonth() + 1) + ".";
const datumVrijeme = d => datumKratko(d) + d.getFullYear() + ". " +
  String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const emojiZa = naziv => ([...KATEGORIJE, OSTALO].find(k => k.naziv === naziv) || OSTALO).emoji;

// ?danas=2026-10-03 — samo za testiranje logike ciklusa na drugom datumu.
function danasnjiDatum() {
  const p = new URLSearchParams(location.search).get("danas");
  const d = p && parseTimestamp(p);
  const now = new Date();
  return d ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), now.getHours(), now.getMinutes()) : now;
}

const BOJE = {
  "Dućan": "var(--c-ducan)", "Marenda": "var(--c-marenda)", "Izlasci": "var(--c-izlasci)",
  "Cigare": "var(--c-cigare)", "Njega": "var(--c-njega)", "Auto": "var(--c-auto)",
  "Iznimke": "var(--c-iznimke)", "Ostalo": "var(--c-ostalo)",
};
const bojaZa = naziv => BOJE[naziv] || "var(--c-ostalo)";

// 1 dan, 2 dana, 5 dana, 21 dan, 11 dana
const dana = n => n + (n % 10 === 1 && n % 100 !== 11 ? " dan" : " dana");

function krug(ukupno) {
  const r = 88, C = 2 * Math.PI * r;
  const p = Math.min(ukupno / UKUPNI_PRAG, 1);
  const boja = { ok: "var(--green)", warn: "var(--yellow)", over: "var(--red)" }[statusUkupno(ukupno)];
  return `
    <div class="ring" role="img" aria-label="Potrošeno ${eur(ukupno)}">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--track)" stroke-width="16"/>
        <circle class="fill" cx="100" cy="100" r="${r}" fill="none" stroke="${boja}" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${p > 0 ? C * (1 - p) : C}"
          ${p === 0 ? 'stroke-opacity="0"' : ""}/>
      </svg>
      <div class="val"><div class="num ${statusUkupno(ukupno) === "over" ? "preko" : ""}">${Math.round(ukupno).toLocaleString("hr-HR")}<small>€</small></div></div>
    </div>`;
}

function barovi(kategorije) {
  return kategorije.map(k => {
    // Bez limita (Iznimke/Ostalo): samo broj, bez bara — nema limita koji bi se "punio".
    if (k.limit == null) return `
      <div class="bar-row">
        <div class="bar-head"><span>${k.emoji} ${esc(k.naziv)}</span><span class="n">${Math.round(k.iznos)}</span></div>
      </div>`;
    const s = statusLimita(k.iznos, k.limit);
    return `
      <div class="bar-row">
        <div class="bar-head"><span>${k.emoji} ${esc(k.naziv)}</span><span class="n">${Math.round(k.iznos)}<span>/${k.limit}</span>${s === "over" ? '<span class="flag" aria-label="prešao limit">!</span>' : ""}</span></div>
        <div class="bar"><i class="s-${s}" style="width:${(Math.min(k.iznos / k.limit, 1) * 100).toFixed(1)}%"></i></div>
      </div>`;
  }).join("");
}

function donut(kategorije, ukupno) {
  const dijelovi = kategorije.filter(k => k.iznos > 0).sort((a, b) => b.iznos - a.iznos);
  const r = 60, C = 2 * Math.PI * r, gap = dijelovi.length > 1 ? 2 : 0;
  let pomak = 0;
  const seg = dijelovi.map((k, i) => {
    const duz = (k.iznos / ukupno) * C;
    const s = `<circle class="seg" data-i="${i}" cx="80" cy="80" r="${r}" fill="none" stroke="${bojaZa(k.naziv)}" stroke-width="22"
      stroke-dasharray="${Math.max(duz - gap, 0.5)} ${C}" stroke-dashoffset="${-pomak}"/>`;
    pomak += duz;
    return s;
  }).join("");
  const postotak = k => Math.round((k.iznos / ukupno) * 100) + " %";
  const legenda = dijelovi.map((k, i) => `
    <div class="li" data-i="${i}">
      <span class="sw" style="background:${bojaZa(k.naziv)}"></span>
      <span class="nm">${k.emoji} ${esc(k.naziv)}</span>
      <span class="pc">${postotak(k)}</span>
      <span class="eu">${eur(k.iznos)}</span>
    </div>`).join("");
  return {
    html: `
      <div class="donut-wrap">
        <div class="donut" id="donut">
          <svg viewBox="0 0 160 160">${seg}</svg>
          <div class="center" id="donut-c"></div>
        </div>
        <div class="legend" id="legend">${legenda}</div>
      </div>`,
    // Tap na segment ili red legende → sredina pokaže tu kategoriju; ponovni tap → ukupno.
    spoji() {
      const d = document.getElementById("donut"), c = document.getElementById("donut-c");
      let sel = null;
      const prikazi = () => {
        const k = dijelovi[sel];
        c.innerHTML = k
          ? `<span class="muted">${k.emoji} ${esc(k.naziv)}</span><b>${postotak(k)}</b><span class="muted">${eur(k.iznos)}</span>`
          : `<span class="muted">ukupno</span><b>${eur(ukupno)}</b>`;
        d.classList.toggle("has-sel", k != null);
        document.querySelectorAll("#donut .seg, #legend .li").forEach(el => el.classList.toggle("sel", +el.dataset.i === sel));
      };
      document.querySelectorAll("#donut .seg, #legend .li").forEach(el => el.addEventListener("click", () => {
        sel = sel === +el.dataset.i ? null : +el.dataset.i;
        prikazi();
      }));
      prikazi();
    },
  };
}

function top3(troskovi) {
  return topTroskovi(troskovi, 3).map((t, i) => `
    <div class="top3">
      <div class="rank">${i + 1}</div>
      <div class="info">
        <div>${emojiZa(t.kategorija)} ${esc(t.kategorija)}${t.opis ? ` · ${esc(t.opis)}` : ""}</div>
        <div class="muted">${datumKratko(t.timestamp)}</div>
      </div>
      <div class="amt">${eur(t.iznos)}</div>
    </div>`).join("");
}

const DANI_KRATKO = ["ned", "pon", "uto", "sri", "čet", "pet", "sub"];
let modDnevno = "dan"; // "dan" | "kum" — Home se otvara "po danu" (samo u memoriji)

// Area chart dnevne potrošnje (spec 5.6). Zupčasto = točno, bez izglađivanja.
function grafDnevno(dani, mod, sel) {
  const W = 340, H = 168, L = 30, top = 12, bot = 140;
  const n = dani.length, sw = (W - L) / n;
  const vr = d => mod === "kum" ? d.kumulativno : d.iznos;
  const tocke = dani.map((d, i) => ({ i, v: vr(d) })).filter(p => p.v != null);
  const najvise = Math.max(0, ...tocke.map(p => p.v));
  const max = mod === "kum" ? lijepiMax(Math.max(UKUPNI_PRAG, najvise)) : lijepiMax(Math.max(10, najvise));
  const x = i => L + (i + 0.5) * sw;
  const y = v => bot - (v / max) * (bot - top);
  const pts = tocke.map(p => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`);
  const zadnja = tocke[tocke.length - 1];
  const area = tocke.length
    ? `<path d="M${x(tocke[0].i)},${bot}L${pts.join("L")}L${x(zadnja.i)},${bot}Z" fill="var(--c-ducan)" fill-opacity="0.16"/>
       <polyline points="${pts.join(" ")}" fill="none" stroke="var(--c-ducan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    : "";
  const prag = mod === "kum"
    ? `<line x1="${L}" x2="${W}" y1="${y(UKUPNI_PRAG)}" y2="${y(UKUPNI_PRAG)}" stroke="var(--red)" stroke-width="1" stroke-opacity="0.5"/>
       <text x="${W}" y="${y(UKUPNI_PRAG) - 4}" text-anchor="end" class="ax">prag ${UKUPNI_PRAG}</text>` : "";
  const osX = dani.map((d, i) => i % 7 === 0
    ? `<text x="${x(i)}" y="${bot + 16}" text-anchor="middle" class="ax">${datumKratko(d.datum)}</text>` : "").join("");
  const odabir = sel != null && vr(dani[sel]) != null
    ? `<line x1="${x(sel)}" x2="${x(sel)}" y1="${top}" y2="${bot}" stroke="var(--muted)" stroke-width="1"/>
       <circle cx="${x(sel)}" cy="${y(vr(dani[sel]))}" r="4.5" fill="var(--c-ducan)" stroke="var(--card)" stroke-width="2"/>`
    : zadnja ? `<circle cx="${x(zadnja.i)}" cy="${y(zadnja.v)}" r="4" fill="var(--c-ducan)" stroke="var(--card)" stroke-width="2"/>` : "";
  const hit = dani.map((d, i) => `<rect class="hit" data-i="${i}" x="${L + i * sw}" y="0" width="${sw}" height="${bot}" fill="transparent"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${mreza(W, top, bot, max, L)}${prag}
    <line x1="${L}" x2="${W}" y1="${bot}" y2="${bot}" stroke="var(--axis)" stroke-width="1"/>${area}${osX}${odabir}${hit}</svg>`;
}

function spojiDnevno(dani) {
  let sel = null;
  const dan = d => `${datumKratko(d.datum)} <span class="muted">${DANI_KRATKO[d.datum.getDay()]}</span>`;
  const crtaj = () => {
    document.getElementById("g-dan").innerHTML = grafDnevno(dani, modDnevno, sel);
    const d = sel != null ? dani[sel] : null;
    const zadnji = [...dani].reverse().find(x => x.iznos != null);
    const najveci = dani.reduce((a, b) => (b.iznos || 0) > (a.iznos || 0) ? b : a, dani[0]);
    document.getElementById("g-dan-d").innerHTML = d
      ? (d.iznos == null ? `${dan(d)} · <span class="muted">još nije</span>`
        : modDnevno === "kum" ? `do ${dan(d)}: <b>${eur(d.kumulativno)}</b>` : `${dan(d)}: <b>${eur(d.iznos)}</b>`)
      : modDnevno === "kum"
        ? `<span class="muted">do danas:</span> <b>${eur(zadnji ? zadnji.kumulativno : 0)}</b>`
        : (najveci.iznos ? `<span class="muted">najviše u danu:</span> ${dan(najveci)} · <b>${eur(najveci.iznos)}</b>` : `<span class="muted">još nema troškova</span>`);
    document.querySelectorAll("#dnevno-toggle button").forEach(b => b.classList.toggle("on", b.dataset.m === modDnevno));
    document.querySelectorAll("#g-dan .hit").forEach(r => r.addEventListener("click", () => {
      sel = sel === +r.dataset.i ? null : +r.dataset.i;
      crtaj();
    }));
  };
  document.querySelectorAll("#dnevno-toggle button").forEach(b => b.addEventListener("click", () => {
    modDnevno = b.dataset.m;
    crtaj();
  }));
  crtaj();
}

// HOME — spec 5
function prikaziHome(troskovi, danas) {
  const c = ciklusZa(danas);
  const uCiklusu = uRasponu(troskovi, c.start, c.end);
  const ukupno = zbroj(uCiklusu);
  const preostalo = preostaloDana(c, danas);
  const kategorije = poKategoriji(uCiklusu);
  const d = uCiklusu.length ? donut(kategorije, ukupno) : null;
  const sad = new Date();

  document.getElementById("app").innerHTML = `
    ${nav("home")}
    <div class="top">
      <h1>${oznakaCiklusa(c)}</h1>
      <span class="muted">${datumKratko(c.start)} – ${datumKratko(new Date(c.end.getFullYear(), c.end.getMonth(), c.end.getDate() - 1))}</span>
    </div>

    <div class="card hero">
      ${krug(ukupno)}
      <div class="sub">${preostalo > 0 ? "preostalo " + dana(preostalo) : "zadnji dan ciklusa"} · ~${eur(ukupno / protekloDana(c, danas))}/dan</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Kroz ciklus</h2>
        <div class="seg-toggle" id="dnevno-toggle">
          <button data-m="dan">Po danu</button>
          <button data-m="kum">Kumulativno</button>
        </div>
      </div>
      <div id="g-dan"></div>
      <div class="detail" id="g-dan-d"></div>
    </div>

    <div class="card">
      <h2>Kategorije</h2>
      ${barovi(kategorije)}
    </div>

    <div class="card">
      <h2>Raspodjela</h2>
      ${d ? d.html : '<p class="muted">Još nema troškova u ovom ciklusu.</p>'}
    </div>

    <div class="card">
      <h2>Top 3 troška</h2>
      ${uCiklusu.length ? top3(uCiklusu) : '<p class="muted">Još nema troškova u ovom ciklusu.</p>'}
    </div>

    <p class="muted foot">ažurirano ${String(sad.getHours()).padStart(2, "0")}:${String(sad.getMinutes()).padStart(2, "0")}</p>
  `;
  if (d) d.spoji();
  spojiDnevno(dnevneSume(troskovi, danas));
}

// ---------- GRAFOVI (spec 6) ----------

const MJ_KRATKO = ["sij", "velj", "ožu", "tra", "svi", "lip", "srp", "kol", "ruj", "lis", "stu", "pro"];
const bojaStatusa = s => ({ ok: "var(--green)", warn: "var(--yellow)", over: "var(--red)" })[s];

// Okrugli vrh osi: 1, 2, 2.5, 5 × 10^n
function lijepiMax(v) {
  if (v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(x => x >= v);
}

// Stupac zaobljen samo na vrhu (4px), ravan na bazi.
function stupac(x, y, w, h, boja, extra = "") {
  if (h <= 0) return "";
  const r = Math.min(4, w / 2, h);
  return `<path d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z" fill="${boja}" ${extra}/>`;
}

// Horizontalne linije mreže + oznake osi Y (0, pola, vrh).
function mreza(W, top, bot, max, left) {
  return [0, max / 2, max].map(v => {
    const y = bot - (v / max) * (bot - top);
    return `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${left - 4}" y="${y + 3}" text-anchor="end" class="ax">${Math.round(v)}</text>`;
  }).join("");
}

// 6.3 — tekući vs prošli, vertikalni stupci po kategoriji (boje identiteta).
function grafUsporedba(u) {
  const W = 340, H = 190, L = 30, top = 10, bot = 160;
  const kat = u.kategorije;
  const max = lijepiMax(Math.max(1, ...kat.map(k => Math.max(k.sada, k.prije || 0))));
  const gw = (W - L) / kat.length, bw = Math.min(14, (gw - 10) / 2);
  const y = v => bot - (v / max) * (bot - top);
  const grupe = kat.map((k, i) => {
    const cx = L + gw * i + gw / 2;
    const prosli = u.prosli ? stupac(cx - bw - 1, y(k.prije), bw, bot - y(k.prije), bojaZa(k.naziv), 'fill-opacity="0.35"') : "";
    const tekuci = stupac(u.prosli ? cx + 1 : cx - bw / 2, y(k.sada), bw, bot - y(k.sada), bojaZa(k.naziv));
    return `<g class="grp" data-i="${i}">
      <rect x="${L + gw * i}" y="0" width="${gw}" height="${H}" fill="transparent"/>
      ${prosli}${tekuci}
      <text x="${cx}" y="${bot + 20}" text-anchor="middle" font-size="14">${k.emoji}</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${mreza(W, top, bot, max, L)}
    <line x1="${L}" x2="${W}" y1="${bot}" y2="${bot}" stroke="var(--axis)" stroke-width="1"/>${grupe}</svg>`;
}

// 6.4 (+ 6.2) — zadnjih N ciklusa: stupac = suma ciklusa (status prema pragu), trend kroz zatvorene.
function grafPregled(niz) {
  const W = 340, H = 200, L = 34, top = 18, bot = 170;
  const max = lijepiMax(Math.max(UKUPNI_PRAG, ...niz.map(c => c.iznos)));
  const sw = (W - L) / niz.length, bw = Math.min(24, sw * 0.6);
  const y = v => bot - (v / max) * (bot - top);
  const cx = i => L + sw * i + sw / 2;
  const trend = niz.map((c, i) => ({ c, i })).filter(({ c }) => c.imaPodatke && !c.uTijeku);
  const stupci = niz.map((c, i) => {
    const boja = bojaStatusa(statusUkupno(c.iznos));
    const oznaka = niz.length <= 6 && c.imaPodatke
      ? `<text x="${cx(i)}" y="${y(c.iznos) - 10}" text-anchor="middle" class="val">${Math.round(c.iznos)}</text>` : "";
    const tijelo = c.imaPodatke
      ? stupac(cx(i) - bw / 2, y(c.iznos), bw, bot - y(c.iznos), boja, c.uTijeku ? 'fill-opacity="0.4"' : "")
      : `<rect x="${cx(i) - bw / 2}" y="${bot - 3}" width="${bw}" height="3" rx="1.5" fill="var(--track)"/>`;
    return `<g class="grp" data-i="${i}">
      <rect x="${L + sw * i}" y="0" width="${sw}" height="${H}" fill="transparent"/>
      ${tijelo}${oznaka}
      <text x="${cx(i)}" y="${bot + 16}" text-anchor="middle" class="ax ${c.uTijeku ? "cur" : ""}">${MJ_KRATKO[c.ciklus.start.getMonth()]}</text>
    </g>`;
  }).join("");
  const linija = trend.length >= 2
    ? `<polyline points="${trend.map(({ c, i }) => `${cx(i)},${y(c.iznos)}`).join(" ")}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>` +
      trend.map(({ c, i }) => `<circle cx="${cx(i)}" cy="${y(c.iznos)}" r="4" fill="var(--text)" stroke="var(--card)" stroke-width="2" pointer-events="none"/>`).join("")
    : "";
  const prag = `<line x1="${L}" x2="${W}" y1="${y(UKUPNI_PRAG)}" y2="${y(UKUPNI_PRAG)}" stroke="var(--red)" stroke-width="1" stroke-opacity="0.5"/>
    <text x="${W}" y="${y(UKUPNI_PRAG) - 4}" text-anchor="end" class="ax">prag ${UKUPNI_PRAG}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${mreza(W, top, bot, max, L)}${prag}
    <line x1="${L}" x2="${W}" y1="${bot}" y2="${bot}" stroke="var(--axis)" stroke-width="1"/>${stupci}${linija}</svg>`;
}

// Tap na grupu stupaca → redak s detaljem ispod grafa; ponovni tap → zadani tekst.
function spojiTap(svgWrap, detalj, tekstZa, zadano) {
  let sel = null;
  const prikazi = () => {
    detalj.innerHTML = sel == null ? zadano : tekstZa(sel);
    svgWrap.querySelectorAll(".grp").forEach(g => g.classList.toggle("dim", sel != null && +g.dataset.i !== sel));
  };
  svgWrap.querySelectorAll(".grp").forEach(g => g.addEventListener("click", () => {
    sel = sel === +g.dataset.i ? null : +g.dataset.i;
    prikazi();
  }));
  prikazi();
}

let pregledN = 6; // toggle 6 / 12 ciklusa (samo u memoriji)

function prikaziGrafovi(troskovi, danas) {
  const u = usporedbaCiklusa(troskovi, danas);
  const isti = istiDanProslog(troskovi, danas);
  const zatvoreni = zatvoreniCiklusi(troskovi, danas);
  const oz = c => oznakaCiklusa(c);

  const istiHtml = isti
    ? (() => {
        const razlika = isti.sada - isti.prije;
        return `<p class="isti">Na <b>${isti.dan}. dan</b> prošlog ciklusa (${oz(isti.prosli)}) bio si na <b>${eur(isti.prije)}</b>, sad si na <b>${eur(isti.sada)}</b>.
          <span class="muted">${Math.abs(razlika) < 0.5 ? "Isti tempo." : razlika > 0 ? `${eur(razlika)} više nego tada.` : `${eur(-razlika)} manje nego tada.`}</span></p>`;
      })()
    : `<p class="muted">"Isti dan prošlog ciklusa" radi kad postoji pun prošli ciklus — od ${datumKratko(ciklusZa(danas).end)} nadalje.</p>`;

  document.getElementById("app").innerHTML = `
    ${nav("grafovi")}
    <div class="top"><h1>Grafovi</h1></div>

    <div class="card">
      <h2>${u.prosli ? `${oz(u.tekuci)} vs ${oz(u.prosli)}` : `${oz(u.tekuci)} po kategorijama`}</h2>
      ${u.prosli ? `<div class="key"><span><i class="kk"></i>${oz(u.tekuci)}</span><span><i class="kk faint"></i>${oz(u.prosli)}</span></div>`
                 : `<p class="muted">Još nema prošlog ciklusa za usporedbu — prikazan je samo tekući.</p>`}
      <div id="g-usp">${grafUsporedba(u)}</div>
      <div class="detail" id="g-usp-d"></div>
      ${istiHtml}
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Pregled</h2>
        <div class="seg-toggle" id="pregled-toggle">
          <button data-n="6" class="${pregledN === 6 ? "on" : ""}">6 ciklusa</button>
          <button data-n="12" class="${pregledN === 12 ? "on" : ""}">12 ciklusa</button>
        </div>
      </div>
      <div id="g-pre"></div>
      <div class="detail" id="g-pre-d"></div>
      <p class="muted" id="g-pre-note"></p>
    </div>

    <div class="card">
      <h2>Prošli ciklusi</h2>
      ${zatvoreni.length
        ? zatvoreni.map(z => `<div class="kv"><span><i class="dot" style="background:${bojaStatusa(statusUkupno(z.iznos))}"></i>${oz(z.ciklus)} <span class="muted">${datumKratko(z.ciklus.start)}–${datumKratko(new Date(z.ciklus.end.getFullYear(), z.ciklus.end.getMonth(), z.ciklus.end.getDate() - 1))}</span></span><b>${eur(z.iznos)}</b></div>`).join("")
        : `<p class="muted">Još nema zatvorenih ciklusa. Prvi se zatvara ${datumKratko(ciklusZa(danas).end)}</p>`}
    </div>
  `;

  spojiTap(document.getElementById("g-usp"), document.getElementById("g-usp-d"), i => {
    const k = u.kategorije[i];
    return `${k.emoji} ${esc(k.naziv)}: <b>${eur(k.sada)}</b>${k.prije != null ? ` <span class="muted">· prošli ${eur(k.prije)}</span>` : ""}${k.limit != null ? ` <span class="muted">· limit ${k.limit}</span>` : ""}`;
  }, `<span class="muted">Tapni kategoriju za iznose.</span>`);

  const crtajPregled = () => {
    const niz = zadnjihCiklusa(troskovi, danas, pregledN);
    document.getElementById("g-pre").innerHTML = grafPregled(niz);
    const zatv = niz.filter(c => c.imaPodatke && !c.uTijeku).length;
    document.getElementById("g-pre-note").textContent = zatv >= 2
      ? "Linija = trend zatvorenih ciklusa. Blijedi stupac = tekući ciklus (u tijeku)."
      : `Trend linija se pojavljuje kad budu barem 2 zatvorena ciklusa (sad: ${zatv}). Blijedi stupac = tekući ciklus (u tijeku).`;
    spojiTap(document.getElementById("g-pre"), document.getElementById("g-pre-d"), i => {
      const c = niz[i];
      return c.imaPodatke
        ? `${oz(c.ciklus)}: <b>${eur(c.iznos)}</b>${c.uTijeku ? ' <span class="muted">· u tijeku</span>' : ""}`
        : `${oz(c.ciklus)}: <span class="muted">nema podataka</span>`;
    }, `<span class="muted">Tapni stupac za iznos.</span>`);
    document.querySelectorAll("#pregled-toggle button").forEach(b => b.classList.toggle("on", +b.dataset.n === pregledN));
  };
  document.querySelectorAll("#pregled-toggle button").forEach(b => b.addEventListener("click", () => {
    pregledN = +b.dataset.n;
    crtajPregled();
  }));
  crtajPregled();
}

// ---------- CUSTOM RASPON (spec 7) ----------

// "2026-09-18" ↔ Date (lokalno), za <input type="date">
const uIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
let raspon = null; // { od, do } — pamti se samo dok je app otvorena (bez storage-a)

function prikaziCustom(troskovi, danas) {
  // Zadano: od početka tekućeg ciklusa do danas.
  if (!raspon) raspon = { od: uIso(ciklusZa(danas).start), do: uIso(danas) };

  document.getElementById("app").innerHTML = `
    ${nav("custom")}
    <div class="top"><h1>Custom raspon</h1></div>

    <div class="card">
      <button class="raspon-btn" id="r-btn"></button>
      <div id="r-kal" hidden></div>
      <p class="muted" style="margin:8px 0 0">Oba datuma su uključena (cijeli dan).</p>
    </div>

    <div id="r-rez"></div>
  `;

  const crtaj = () => {
    const od = parseTimestamp(raspon.od), doD = parseTimestamp(raspon.do);
    const rez = document.getElementById("r-rez");
    if (!od || !doD) { rez.innerHTML = `<div class="card"><p class="muted">Odaberi oba datuma.</p></div>`; return; }
    if (od > doD) { rez.innerHTML = `<div class="card"><p class="err">Datum "od" je nakon datuma "do".</p></div>`; return; }

    const lista = troskoviOdDo(troskovi, od, doD);
    const ukupno = zbroj(lista);
    const brojDana = danIndeks(doD) - danIndeks(od) + 1;
    const kat = poKategoriji(lista).filter(k => k.iznos > 0).sort((a, b) => b.iznos - a.iznos);

    rez.innerHTML = `
      <div class="card hero">
        <div class="big-num">${Math.round(ukupno).toLocaleString("hr-HR")}<small>€</small></div>
        <div class="sub">${datumKratko(od)}${od.getFullYear()}. – ${datumKratko(doD)}${doD.getFullYear()}. · ${dana(brojDana)} · ${lista.length} troškova</div>
      </div>

      ${lista.length ? `
      <div class="card">
        <h2>Po kategoriji</h2>
        ${kat.map(k => `
          <div class="kv"><span><i class="dot" style="background:${bojaZa(k.naziv)}"></i>${k.emoji} ${esc(k.naziv)}</span>
            <b>${eur(k.iznos)} <span class="muted">· ${Math.round((k.iznos / ukupno) * 100)} %</span></b></div>`).join("")}
      </div>

      <div class="card">
        <h2>Svi troškovi</h2>
        ${lista.map(t => `
          <div class="tr-row">
            <div class="tr-info">
              <div>${emojiZa(t.kategorija)} ${esc(t.kategorija)}${t.opis ? ` · ${esc(t.opis)}` : ""}</div>
              <div class="muted">${datumKratko(t.timestamp)} ${DANI_KRATKO[t.timestamp.getDay()]} · ${String(t.timestamp.getHours()).padStart(2, "0")}:${String(t.timestamp.getMinutes()).padStart(2, "0")}</div>
            </div>
            <b>${tocno(t.iznos)}</b>
          </div>`).join("")}
      </div>` : `<div class="card"><p class="muted">Nema troškova u ovom rasponu.</p></div>`}
    `;
  };

  // Kalendar kao kod letova: tap na raspon → tap početni dan → tap završni dan → zatvori se.
  const btn = document.getElementById("r-btn"), kalEl = document.getElementById("r-kal");
  const daniSTroskom = new Set(troskovi.map(t => uIso(t.timestamp)));
  const kratko = iso => { const d = parseTimestamp(iso); return `${datumKratko(d)}${d.getFullYear()}.`; };
  let prvi = null, mjesec = null;

  const crtajGumb = () => {
    btn.innerHTML = `<span><span class="muted">od</span> ${kratko(raspon.od)}</span><span class="muted">→</span><span><span class="muted">do</span> ${kratko(raspon.do)}</span>`;
    btn.classList.toggle("open", !kalEl.hidden);
  };
  const crtajKal = () => {
    const y = mjesec.getFullYear(), m = mjesec.getMonth();
    const danasIso = uIso(danas);
    const cell = iso => {
      if (!iso) return `<span></span>`;
      const od = prvi || raspon.od, doI = prvi || raspon.do;
      const cls = [
        iso === od || iso === doI ? "end" : iso > od && iso < doI ? "in" : "",
        iso === danasIso ? "today" : "",
      ].join(" ");
      return `<button class="d ${cls}" data-iso="${iso}">${+iso.slice(8)}${daniSTroskom.has(iso) ? "<i></i>" : ""}</button>`;
    };
    kalEl.innerHTML = `
      <div class="kal-head">
        <button class="kal-nav" data-m="-1" aria-label="prethodni mjesec">‹</button>
        <b>${MJESECI[m]} ${y}</b>
        <button class="kal-nav" data-m="1" aria-label="sljedeći mjesec">›</button>
      </div>
      <div class="kal-hint">${prvi ? `od <b>${kratko(prvi)}</b> — sad odaberi završni dan` : "Odaberi početni dan"}</div>
      <div class="kal-grid">
        ${["pon", "uto", "sri", "čet", "pet", "sub", "ned"].map(d => `<span class="dow">${d}</span>`).join("")}
        ${kalendarMjesec(y, m).flat().map(cell).join("")}
      </div>`;
    kalEl.querySelectorAll(".kal-nav").forEach(b => b.addEventListener("click", () => {
      mjesec = new Date(y, m + +b.dataset.m, 1);
      crtajKal();
    }));
    kalEl.querySelectorAll(".d").forEach(b => b.addEventListener("click", () => {
      const r = klikKalendar(prvi, b.dataset.iso);
      prvi = r.prvi;
      if (r.gotovo) {
        raspon = r.gotovo;
        kalEl.hidden = true;
        crtaj();
        crtajGumb();
      } else crtajKal();
    }));
  };

  btn.addEventListener("click", () => {
    kalEl.hidden = !kalEl.hidden;
    prvi = null; // zatvaranje bez drugog tapa = odustani, raspon ostaje stari
    if (!kalEl.hidden) {
      const d = parseTimestamp(raspon.do);
      mjesec = new Date(d.getFullYear(), d.getMonth(), 1);
      crtajKal();
    }
    crtajGumb();
  });
  crtajGumb();
  crtaj();
}

// Mjesec kao tjedni (pon → ned), prazna mjesta = null. Elementi: "yyyy-mm-dd".
function kalendarMjesec(y, m) {
  const pomak = (new Date(y, m, 1).getDay() + 6) % 7; // pon = 0
  const dana = new Date(y, m + 1, 0).getDate();
  const polja = [...Array(pomak).fill(null), ...Array.from({ length: dana }, (_, i) => uIso(new Date(y, m, i + 1)))];
  while (polja.length % 7) polja.push(null);
  return Array.from({ length: polja.length / 7 }, (_, i) => polja.slice(i * 7, i * 7 + 7));
}

// Odabir raspona u dva tapa. Drugi tap raniji od prvog = novi početak. Isti dan dvaput = jedan dan.
function klikKalendar(prvi, iso) {
  if (!prvi || iso < prvi) return { prvi: iso, gotovo: null };
  return { prvi: null, gotovo: { od: prvi, do: iso } };
}

// Privremena navigacija (bez dizajna) — pravi donji tab-bar je Faza 6.
function nav(aktivna) {
  const l = (id, tekst) => id === aktivna ? `<b>${tekst}</b>` : `<a href="#${id}">${tekst}</a>`;
  return `<nav class="tmpnav">${l("home", "Home")} · ${l("grafovi", "Grafovi")} · ${l("custom", "Custom")}</nav>`;
}

function poruka(tekst, detalj) {
  document.getElementById("app").innerHTML =
    `<div class="card msg"><div class="err">${esc(tekst)}</div>${detalj ? `<p class="muted">${esc(detalj)}</p>` : ""}</div>`;
}

function redTroska(t) {
  return `<tr><td>${datumVrijeme(t.timestamp)}</td><td class="num">${tocno(t.iznos)}</td>` +
    `<td>${emojiZa(t.kategorija)} ${esc(t.kategorija)}</td><td class="opis">${esc(t.opis) || '<span class="muted">—</span>'}</td></tr>`;
}

function tablicaTroskova(lista) {
  return `<div class="table-wrap"><table><tr><th>Vrijeme</th><th class="num">Iznos</th><th>Kategorija</th><th>Opis</th></tr>` +
    lista.map(redTroska).join("") + `</table></div>`;
}

// DOKAZ za Faze 1–2: ispis učitanih podataka i tekućeg ciklusa.
function prikaziDokaz(troskovi, preskoceno, danas) {
  const ukupno = zbroj(troskovi);
  const c = ciklusZa(danas);
  const uCiklusu = uRasponu(troskovi, c.start, c.end);
  const ukupnoCiklus = zbroj(uCiklusu);
  const proteklo = protekloDana(c, danas);
  const ciklusi = sviCiklusi(troskovi, danas);
  const zbrojCiklusa = ciklusi.reduce((s, x) => s + zbroj(uRasponu(troskovi, x.start, x.end)), 0);
  const izvanCiklusa = troskovi.length - ciklusi.reduce((s, x) => s + uRasponu(troskovi, x.start, x.end).length, 0);
  const zadnjiDan = new Date(c.end.getFullYear(), c.end.getMonth(), c.end.getDate() - 1);
  const nepoznate = [...new Set(troskovi.filter(t => t.kategorija === OSTALO.naziv).map(t => t.kategorijaSirova))];

  document.getElementById("app").innerHTML = `
    <h1>Potrošnja — dokaz čitanja</h1>

    <div class="card">
      <h2>Faza 1 · Podaci iz Sheeta</h2>
      <div class="kv"><span>Učitano troškova</span><b>${troskovi.length}</b></div>
      <div class="kv"><span>Preskočeno (loš iznos/datum)</span><b class="${preskoceno.length ? "err" : ""}">${preskoceno.length}</b></div>
      <div class="kv"><span>Ukupno (točno)</span><b>${tocno(ukupno)}</b></div>
      <div class="kv"><span>Ukupno (prikaz)</span><b>${eur(ukupno)}</b></div>
      <div class="kv"><span>Nepoznate kategorije → Ostalo</span><b class="${nepoznate.length ? "err" : "ok"}">${nepoznate.length ? esc(nepoznate.join(", ")) : "nema ✓"}</b></div>
    </div>

    <div class="card">
      <h2>Po kategoriji (sve)</h2>
      ${poKategoriji(troskovi).map(k =>
        `<div class="kv"><span>${k.emoji} ${esc(k.naziv)} <span class="muted">· ${k.broj} kom</span></span><b>${tocno(k.iznos)}</b></div>`).join("")}
    </div>

    <div class="card">
      <h2>Prvih 5</h2>
      ${tablicaTroskova(troskovi.slice(0, 5))}
    </div>
    <div class="card">
      <h2>Zadnjih 5</h2>
      ${tablicaTroskova(troskovi.slice(-5))}
    </div>
    ${preskoceno.length ? `<div class="card"><h2>Preskočeni redovi</h2>
      ${preskoceno.map(r => `<div class="muted">${esc(r.join(" | "))}</div>`).join("")}</div>` : ""}

    <div class="card">
      <h2>Faza 2 · Tekući ciklus</h2>
      <div class="big">${eur(ukupnoCiklus)}</div>
      <div class="muted">${oznakaCiklusa(c)} · ${uCiklusu.length} troškova · točno ${tocno(ukupnoCiklus)}</div>
      <div style="height:10px"></div>
      <div class="kv"><span>Danas</span><b>${datumKratko(danas)}${danas.getFullYear()}.</b></div>
      <div class="kv"><span>Raspon</span><b>${datumKratko(c.start)} – ${datumKratko(zadnjiDan)} <span class="muted">(${datumKratko(c.end)} isključiv)</span></b></div>
      <div class="kv"><span>Proteklo dana (uklj. danas)</span><b>${proteklo}</b></div>
      <div class="kv"><span>Preostalo dana (od sutra)</span><b>${preostaloDana(c, danas)}</b></div>
      <div class="kv"><span>Prosjek po danu</span><b>~${eur(ukupnoCiklus / proteklo)}/dan</b></div>
      ${(() => {
        const dani = dnevneSume(troskovi, danas);
        const zbrojDana = dani.reduce((s, d) => s + (d.iznos || 0), 0);
        const kum = [...dani].reverse().find(d => d.kumulativno != null)?.kumulativno ?? 0;
        const ok = Math.abs(zbrojDana - ukupnoCiklus) < 1e-9 && Math.abs(kum - ukupnoCiklus) < 1e-9;
        return `<div class="kv"><span>Faza 4.5 · zbroj dnevnih = krug</span><b class="${ok ? "ok" : "err"}">${tocno(zbrojDana)} · kum. ${tocno(kum)} ${ok ? "✓" : "✗"}</b></div>`;
      })()}
    </div>

    <div class="card">
      <h2>Svi ciklusi (rekonstrukcija)</h2>
      ${ciklusi.slice().reverse().map(x => {
        const t = uRasponu(troskovi, x.start, x.end);
        return `<div class="kv"><span>${oznakaCiklusa(x)} <span class="muted">${datumKratko(x.start)}–${datumKratko(x.end)}</span></span><b>${eur(zbroj(t))} <span class="muted">· ${t.length} kom</span></b></div>`;
      }).join("")}
      <div class="kv"><span>Kontrola: zbroj ciklusa = ukupno</span>
        <b class="${Math.abs(zbrojCiklusa - ukupno) < 1e-9 && izvanCiklusa === 0 ? "ok" : "err"}">${tocno(zbrojCiklusa)} ${Math.abs(zbrojCiklusa - ukupno) < 1e-9 && izvanCiklusa === 0 ? "✓" : `✗ (${izvanCiklusa} izvan)`}</b></div>
    </div>

    <p class="muted" style="text-align:center">Test drugog datuma: <code>?debug=1&amp;danas=2026-10-03</code> · Home: makni <code>debug=1</code></p>
  `;
}

let podaci = null; // zadnje učitano: { troskovi, preskoceno }

// Crta stranicu iz adrese (#grafovi …) nad već učitanim podacima — bez novog fetcha.
function prikazi() {
  if (!podaci) return;
  const { troskovi, preskoceno } = podaci;
  try {
    if (!troskovi.length) return poruka("Još nema troškova u Sheetu.", preskoceno.length ? `Preskočeno ${preskoceno.length} neispravnih redova.` : "");
    const danas = danasnjiDatum();
    // ?debug=1 → ispis za provjeru čitanja i ciklusa (Faze 1–2)
    if (new URLSearchParams(location.search).has("debug")) prikaziDokaz(troskovi, preskoceno, danas);
    else if (location.hash === "#grafovi") prikaziGrafovi(troskovi, danas);
    else if (location.hash === "#custom") prikaziCustom(troskovi, danas);
    else prikaziHome(troskovi, danas);
    window.scrollTo(0, 0);
  } catch (e) {
    poruka("Greška pri obradi podataka.", e.message);
  }
}

async function start() {
  let tekst;
  try {
    tekst = await dohvatiCSV();
  } catch (e) {
    return poruka("Ne mogu dohvatiti podatke iz Sheeta.", "Provjeri internet vezu i pokušaj ponovno. (" + e.message + ")");
  }
  try {
    podaci = ucitajTroskove(tekst);
  } catch (e) {
    return poruka("Greška pri obradi podataka.", e.message);
  }
  prikazi();
}

if (typeof document !== "undefined") {
  start();
  window.addEventListener("hashchange", prikazi);
  // Home-screen app na iOS-u se ne učitava ponovno pri povratku — osvježi podatke kad se vrati u prvi plan.
  let skriveno = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) skriveno = Date.now();
    else if (skriveno && Date.now() - skriveno > 60000) start();
  });
}
